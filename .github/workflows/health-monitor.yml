# ============================================================================
# Production Health Monitor — Lambda + Queue + DLQ Status
# ============================================================================
# Runs every 6 hours. Checks all 5 Lambdas, both SQS queues, both DLQs,
# and CloudWatch alarms. Alerts if anything looks unhealthy.
#
# This is a read-only workflow — it never invokes Lambdas, never enqueues
# messages, and never modifies DynamoDB. Safe to run on schedule.

name: Health Monitor

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run health checks
        id: health
        run: |
          python - <<'HEALTH_SCRIPT'
          import boto3
          import json
          import sys
          from datetime import datetime, timezone, timedelta

          REGION = "us-east-1"
          LAMBDAS = ["job-ingestor", "job-deduplicator", "job-processor", "job-router", "job-sender"]
          QUEUES = ["job-raw-queue", "job-filtered-queue"]
          DLQS = ["job-raw-queue-dlq", "job-filtered-queue-dlq"]

          lambda_client = boto3.client("lambda", region_name=REGION)
          sqs = boto3.client("sqs", region_name=REGION)
          cloudwatch = boto3.client("cloudwatch", region_name=REGION)
          logs_client = boto3.client("logs", region_name=REGION)

          class Severity:
              INFO = "INFO"
              WARNING = "WARNING"
              CRITICAL = "CRITICAL"

          class HealthIssue:
              def __init__(self, component: str, severity: str, message: str):
                  self.component = component
                  self.severity = severity
                  self.message = message

              def is_critical(self) -> bool:
                  return self.severity == Severity.CRITICAL

              def __str__(self) -> str:
                  icon = "🔴" if self.severity == Severity.CRITICAL else ("⚠️" if self.severity == Severity.WARNING else "ℹ️")
                  return f"{icon} [{self.severity}] {self.component}: {self.message}"

          def missed_ingestor_windows(datapoints, start, end):
              """Count 3-hour gaps, including missing CloudWatch datapoints."""
              observed = sorted(
                  dp["Timestamp"] for dp in datapoints
                  if dp.get("Sum", 0) > 0 and isinstance(dp.get("Timestamp"), datetime)
              )
              if not observed:
                  return None  # A summary count exists, but interval telemetry is unavailable.
              missed = 0
              previous = start
              for timestamp in observed + [end]:
                  seconds = (timestamp - previous).total_seconds()
                  if seconds > 10800 + 900:  # 3-hour schedule + 15-minute metric delay.
                      missed += max(1, int((seconds - 900) // 10800))
                  previous = timestamp
              return missed

          issues: list[HealthIssue] = []
          report = []
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          report.append("# 🏥 Production Health Report")
          report.append(f"")
          report.append(f"**Checked:** {now}")
          report.append(f"")

          # ---- Lambda Health ----
          report.append("## Lambda Functions")
          report.append("")
          report.append("| Function | State | Last Update | Last Modified |")
          report.append("|----------|-------|-------------|---------------|")

          for func in LAMBDAS:
              try:
                  cfg = lambda_client.get_function_configuration(FunctionName=func)
                  state = cfg.get("State", "Unknown")
                  update = cfg.get("LastUpdateStatus", "Unknown")
                  modified = cfg.get("LastModified", "Unknown")
                  report.append(f"| {func} | {state} | {update} | {modified} |")
                  if state != "Active":
                      issues.append(HealthIssue(func, Severity.CRITICAL, f"state is {state} (expected Active)"))
                  if update == "Failed":
                      issues.append(HealthIssue(func, Severity.CRITICAL, "last update FAILED"))
              except Exception as e:
                  report.append(f"| {func} | ERROR | - | - |")
                  issues.append(HealthIssue(func, Severity.CRITICAL, f"configuration error: {str(e)[:100]}"))

          report.append("")

          # ---- SQS Queues ----
          report.append("## SQS Queues")
          report.append("")
          report.append("| Queue | Visible | In-Flight | DLQ |")
          report.append("|-------|---------|-----------|-----|")

          for q in QUEUES + DLQS:
              try:
                  url = sqs.get_queue_url(QueueName=q)["QueueUrl"]
                  attrs = sqs.get_queue_attributes(
                      QueueUrl=url,
                      AttributeNames=[
                          "ApproximateNumberOfMessages",
                          "ApproximateNumberOfMessagesNotVisible",
                          "RedrivePolicy",
                      ],
                  )["Attributes"]
                  visible = int(attrs.get("ApproximateNumberOfMessages", 0))
                  inflight = int(attrs.get("ApproximateNumberOfMessagesNotVisible", 0))
                  redrive = attrs.get("RedrivePolicy")
                  dlq_label = "configured" if redrive else "none"
                  report.append(f"| {q} | {visible} | {inflight} | {dlq_label} |")

                  if q in DLQS and visible > 0:
                      issues.append(HealthIssue(q, Severity.CRITICAL, f"has {visible} messages in DLQ indicating failed pipeline executions"))
                  if q in QUEUES and visible > 100:
                      issues.append(HealthIssue(q, Severity.WARNING, f"has {visible} pending messages indicating backlog"))
              except Exception as e:
                  report.append(f"| {q} | ERROR | - | - |")
                  issues.append(HealthIssue(q, Severity.CRITICAL, f"queue error: {str(e)[:100]}"))

          report.append("")

          # ---- EventBridge Ingestion Schedule ----
          report.append("## EventBridge Ingestion Schedule")
          report.append("")
          report.append("| Rule | State | Schedule | Target Lambda | Healthy |")
          report.append("|------|-------|----------|---------------|---------|")

          events = boto3.client("events", region_name=REGION)
          rule_name = "job-search-daily-trigger"
          sched_expr = ""
          try:
              rule_resp = events.describe_rule(Name=rule_name)
              targets_resp = events.list_targets_by_rule(Rule=rule_name)
              targets = targets_resp.get("Targets", [])
              target_arn = targets[0].get("Arn", "None") if targets else "None"
              has_ingestor_target = any("job-ingestor" in t.get("Arn", "") for t in targets)
              state = rule_resp.get("State", "UNKNOWN")
              sched_expr = rule_resp.get("ScheduleExpression", "")
              is_healthy = state == "ENABLED" and has_ingestor_target
              report.append(f"| {rule_name} | {state} | {sched_expr} | {target_arn.split(':')[-1]} | {'✅ Yes' if is_healthy else '⚠️ No'} |")
              if not is_healthy:
                  issues.append(HealthIssue(rule_name, Severity.CRITICAL, f"rule is {state} or missing job-ingestor target"))
          except Exception as e:
              report.append(f"| {rule_name} | NOT FOUND | - | - | ❌ Missing |")
              issues.append(HealthIssue(rule_name, Severity.CRITICAL, f"not configured: {str(e)[:100]}"))

          report.append("")

          # ---- Recent Errors (CloudWatch) ----
          report.append("## Recent Lambda Errors (Last 6 Hours)")
          report.append("")
          report.append("| Function | Error Count |")
          report.append("|----------|-------------|")

          six_hours_ago = datetime.now(timezone.utc) - timedelta(hours=6)
          for func in LAMBDAS:
              try:
                  response = cloudwatch.get_metric_statistics(
                      Namespace="AWS/Lambda",
                      MetricName="Errors",
                      Dimensions=[{"Name": "FunctionName", "Value": func}],
                      StartTime=six_hours_ago,
                      EndTime=datetime.now(timezone.utc),
                      Period=21600,  # 6 hours
                      Statistics=["Sum"],
                  )
                  datapoints = response.get("Datapoints", [])
                  error_count = int(sum(dp.get("Sum", 0) for dp in datapoints))
                  report.append(f"| {func} | {error_count} |")
                  if error_count > 10:
                      issues.append(HealthIssue(func, Severity.WARNING, f"had {error_count} errors in the last 6 hours"))
              except Exception as e:
                  report.append(f"| {func} | N/A |")
                  issues.append(HealthIssue(f"metric:errors:{func}", Severity.WARNING, f"failed to read error metrics: {str(e)[:100]}"))

          report.append("")

          # ---- Source Failures & Rate Limits (CloudWatch Logs) ----
          report.append("## Ingestion Source Health (CloudWatch Logs)")
          report.append("")
          report.append("| Source Type | Pattern | Event Count (Last 6h) | Status |")
          report.append("|-------------|---------|-----------------------|--------|")

          source_patterns = [
              ("JSearch Rate Limit", "JSEARCH_RATE_LIMITED", "Rate limit (429)"),
              ("JSearch Query", "JSEARCH_QUERY_ERROR", "Query request failure"),
              ("Google CSE", "GOOGLE_CSE_QUERY_ERROR", "Search API error / disabled"),
              ("Adzuna", "ADZUNA_QUERY_ERROR", "Adzuna query error"),
              ("Greenhouse HTTP", "GREENHOUSE_HTTP_ERROR", "Greenhouse ATS HTTP error"),
              ("Greenhouse Request", "GREENHOUSE_REQUEST_ERROR", "Greenhouse network/parse error"),
              ("Lever HTTP", "LEVER_HTTP_ERROR", "Lever ATS HTTP error"),
              ("Lever Request", "LEVER_REQUEST_ERROR", "Lever network/parse error"),
              ("Ashby HTTP", "ASHBY_HTTP_ERROR", "Ashby ATS HTTP error"),
              ("Ashby Request", "ASHBY_REQUEST_ERROR", "Ashby network/parse error"),
              ("Generic Source", "SOURCE_ERROR", "General source error"),
          ]

          six_hours_ms = int(six_hours_ago.timestamp() * 1000)
          for src_name, pattern, desc in source_patterns:
              try:
                  events_found = 0
                  next_token = None
                  truncated = False
                  while True:
                      kwargs = {
                          "logGroupName": "/aws/lambda/job-ingestor",
                          "filterPattern": f'"{pattern}"',
                          "startTime": six_hours_ms,
                          "limit": 100,
                      }
                      if next_token:
                          kwargs["nextToken"] = next_token
                      resp = logs_client.filter_log_events(**kwargs)
                      batch = resp.get("events", [])
                      events_found += len(batch)
                      next_token = resp.get("nextToken")
                      if not next_token:
                          break
                      if events_found >= 1000:
                          truncated = True
                          break
                  count_str = f"{events_found}+" if truncated else f"{events_found}"
                  status = "✅ Clean" if events_found == 0 else (f"⚠️ {count_str} events (truncated)" if truncated else f"⚠️ {events_found} events")
                  report.append(f"| {src_name} ({desc}) | {pattern} | {count_str} | {status} |")
                  if events_found > 0:
                      issues.append(HealthIssue(f"source:{src_name.lower().replace(' ', '_')}", Severity.WARNING, f"{count_str} error/rate-limit events ({desc}) in last 6h"))
              except Exception as e:
                  err_str = str(e)
                  is_missing_group = "ResourceNotFoundException" in err_str
                  err_note = "Log group not found" if is_missing_group else f"Error: {err_str[:40]}"
                  report.append(f"| {src_name} | {pattern} | - | ⚠️ Telemetry Unavailable ({err_note}) |")
                  issues.append(HealthIssue(f"telemetry:{src_name.lower().replace(' ', '_')}", Severity.WARNING, f"CloudWatch logs unavailable for {src_name}: {err_note}"))

          report.append("")

          # ---- Throttling (CloudWatch) ----
          report.append("## Recent Throttles (Last 6 Hours)")
          report.append("")
          report.append("| Function | Throttle Count |")
          report.append("|----------|----------------|")

          for func in LAMBDAS:
              try:
                  response = cloudwatch.get_metric_statistics(
                      Namespace="AWS/Lambda",
                      MetricName="Throttles",
                      Dimensions=[{"Name": "FunctionName", "Value": func}],
                      StartTime=six_hours_ago,
                      EndTime=datetime.now(timezone.utc),
                      Period=21600,
                      Statistics=["Sum"],
                  )
                  datapoints = response.get("Datapoints", [])
                  throttle_count = int(sum(dp.get("Sum", 0) for dp in datapoints))
                  report.append(f"| {func} | {throttle_count} |")
                  if throttle_count > 5:
                      issues.append(HealthIssue(func, Severity.WARNING, f"throttled {throttle_count} times in the last 6 hours"))
              except Exception as e:
                  report.append(f"| {func} | N/A |")
                  issues.append(HealthIssue(f"metric:throttles:{func}", Severity.WARNING, f"failed to read throttle metrics: {str(e)[:100]}"))

          report.append("")

          # ---- Invocation Volume & Missed Runs ----
          report.append("## Invocation Volume & Schedule Verification")
          report.append("")
          report.append("| Function | Invocations (Last 6h) | Invocations (Last 24h) | Status |")
          report.append("|----------|-----------------------|------------------------|--------|")

          twenty_four_hours_ago = datetime.now(timezone.utc) - timedelta(hours=24)
          for func in LAMBDAS:
              try:
                  resp_6h = cloudwatch.get_metric_statistics(
                      Namespace="AWS/Lambda",
                      MetricName="Invocations",
                      Dimensions=[{"Name": "FunctionName", "Value": func}],
                      StartTime=six_hours_ago,
                      EndTime=datetime.now(timezone.utc),
                      Period=21600,
                      Statistics=["Sum"],
                  )
                  count_6h = int(sum(dp.get("Sum", 0) for dp in resp_6h.get("Datapoints", [])))

                  resp_24h = cloudwatch.get_metric_statistics(
                      Namespace="AWS/Lambda",
                      MetricName="Invocations",
                      Dimensions=[{"Name": "FunctionName", "Value": func}],
                      StartTime=twenty_four_hours_ago,
                      EndTime=datetime.now(timezone.utc),
                      Period=86400,
                      Statistics=["Sum"],
                  )
                  count_24h = int(sum(dp.get("Sum", 0) for dp in resp_24h.get("Datapoints", [])))

                  status = "✅ Active"
                  if func == "job-ingestor" and count_24h == 0:
                      status = "🔴 No runs in 24h (pipeline inactive)"
                      issues.append(HealthIssue(func, Severity.CRITICAL, "zero invocations in 24 hours (ingestion pipeline did not run)"))
                  elif func == "job-ingestor" and sched_expr == "rate(3 hours)":
                      # A positive 24-hour total can hide missing scheduled windows.
                      resp_intervals = cloudwatch.get_metric_statistics(
                          Namespace="AWS/Lambda",
                          MetricName="Invocations",
                          Dimensions=[{"Name": "FunctionName", "Value": func}],
                          StartTime=twenty_four_hours_ago,
                          EndTime=datetime.now(timezone.utc),
                          Period=300,
                          Statistics=["Sum"],
                      )
                      intervals = resp_intervals.get("Datapoints", [])
                      missed = missed_ingestor_windows(intervals, twenty_four_hours_ago, datetime.now(timezone.utc))
                      if missed is None:
                          issues.append(HealthIssue(func, Severity.WARNING, "invocation interval metrics unavailable despite positive 24h total"))
                      elif missed:
                          issues.append(HealthIssue(func, Severity.WARNING, f"{missed} possible scheduled 3-hour run(s) missed in last 24h"))
                  elif func == "job-ingestor" and sched_expr:
                      issues.append(HealthIssue(func, Severity.WARNING, f"missed-run interval check not configured for schedule {sched_expr}"))

                  report.append(f"| {func} | {count_6h} | {count_24h} | {status} |")
              except Exception as e:
                  report.append(f"| {func} | - | - | N/A |")
                  issues.append(HealthIssue(f"metric:invocations:{func}", Severity.WARNING, f"failed to read invocation metrics: {str(e)[:100]}"))

          report.append("")

          # ---- Summary ----
          report.append("## Health Verdict")
          report.append("")
          if issues:
              report.append(f"⚠️ **{len(issues)} issue(s) detected:**")
              report.append("")
              for issue in issues:
                  report.append(f"- {str(issue)}")
          else:
              report.append("✅ **All systems healthy.** No issues detected.")

          report.append("")

          full_report = "\n".join(report)

          with open("health_report.md", "w", encoding="utf-8") as f:
              f.write(full_report)

          print(full_report)

          if issues:
              print(f"\n{'='*60}")
              print(f"HEALTH CHECK: {len(issues)} ISSUE(S) FOUND")
              for issue in issues:
                  print(f"  - {str(issue)}")
              print(f"{'='*60}")
              critical = [i for i in issues if i.is_critical()]
              if critical:
                  print(f"\nCRITICAL ISSUES FOUND ({len(critical)}): Exiting with failure.")
                  sys.exit(1)
          HEALTH_SCRIPT

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_number }}
          path: health_report.md
          retention-days: 30

      - name: Post summary
        if: always()
        run: |
          if [ -f health_report.md ]; then
            cat health_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
