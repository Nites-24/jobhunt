# ============================================================================
# CI — Unit Tests, Scoring Evals, and Lint
# ============================================================================
# Runs on every push and pull request. All tests use moto mocks — no real AWS
# credentials needed. This is the safety gate before any code reaches deploy.
#
# What it checks:
#   1. Full pytest suite (91+ tests covering all 5 Lambdas)
#   2. Offline scoring guardrail regression evals
#   3. Basic Python linting

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
  workflow_call:

permissions:
  contents: read

env:
  # Mocked AWS env — moto intercepts all calls
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing
  DYNAMODB_TABLE: Jobsearch
  FILTERED_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/job-filtered-queue
  RAW_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/job-raw-queue
  SNS_TOPIC_ARN: arn:aws:sns:us-east-1:123456789012:jobsearch-approvals
  S3_BUCKET_NAME: job-search-pipeline-memory
  RESUME_KEY: data/resume/Teja_Vaka.txt
  SCORE_THRESHOLD: "80"
  BEDROCK_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
  SENDER_LAMBDA_NAME: job-sender
  INGESTOR_LAMBDA_NAME: job-ingestor
  TELEGRAM_SECRET_NAME: telegram
  JSEARCH_SECRET_NAME: jobserch/jsearch
  HUNTER_SECRET_NAME: jobsearch/hunterio
  SENDER_EMAIL: vakateja24@gmail.com
  SECRETS_NAME: jobserch_gmail
  RESUME_BUCKET: job-search-pipeline-memory
  CONTEXT_FOLDERS: "config/,data/"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest moto[all] boto3 botocore

      - name: Run unit tests
        run: pytest tests/ -q --tb=short --junitxml=test-results.xml
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 30

  scoring-evals:
    name: Scoring Guardrail Evals
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 botocore moto[all]

      - name: Run offline scoring evals
        run: |
          python tools/ops/eval_scoring.py --cases evals/scoring_labeled_set.json --threshold 80

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff check
        run: ruff check job_ingestor job_deduplicator job_processor job_router job_sender shared
