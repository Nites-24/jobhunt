[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    ".venv",
    "tmp",
    "tools/ops",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
